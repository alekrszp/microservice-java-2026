spring.application.name=currency-service
server.port=8081

eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

eureka.instance.metadata-map.github.repo=alekrszp/microservice-java-2026

management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

info.app.name=${spring.application.name}
info.app.description=Currency Service
info.app.autor=Alessandro

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

resilience4j.circuitbreaker.instances.bcbClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.bcbClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcbClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bcbClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bcbClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.bcbClient.max-attempts=3
resilience4j.retry.instances.bcbClient.wait-duration=2s
resilience4j.retry.instances.bcbClient.enable-exponential-backoff=true
resilience4j.retry.instances.bcbClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.bcbClient.enable-randomized-wait=true
resilience4j.retry.instances.bcbClient.randomized-wait-factor=0.5